let local=get('mf-local-v1',{accounts:[],transactions:[],categories:{}}), mode=get('mf-mode','local'), config=get('mf-config',null), wid=get('mf-workspace',''), user=null, sdk=null, auth=null, db=null, workspace=null, accounts=[], tx=[], loaded=false, stops=[], authStop=null, cloudEpoch=0, month=today().slice(0,7), page='home', draft=null, filter='', typeFilter='all', memberFilter='all', busy=false, configError='', toastTimer; if(!local.categories)local.categories={};

function balances(date=today()){const map=Object.create(null);for(const a of getAccounts())if(a.openDate<=date)map[a.id]=a.opening;for(const t of getTx()){if(t.date>date)continue;const add=(id,n)=>{if(Object.hasOwn(map,id))map[id]+=n};if(['income','refund','adjust'].includes(t.type))add(t.account,t.amount);if(t.type==='expense')add(t.account,-t.amount);if(t.type==='transfer'){add(t.account,-t.amount);add(t.to,t.amount)}}return map}function totals(date=today()){const b=balances(date), vals=Object.values(b);const assets=vals.filter(x=>x>0).reduce((a,b)=>a+b,0), debt=-vals.filter(x=>x<0).reduce((a,b)=>a+b,0);return{assets,debt,net:assets-debt,b}}function monthList(){let [y,m]=month.split('-').map(Number);return Array.from({length:6},(_,i)=>{let d=new Date(y,m-6+i,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`})}

function home(){const s=stats(currentMonthTx()), total=totals(month===today().slice(0,7)?today():endOf(month)), months=monthList(), rate=s.income>0?(s.income-s.expense)/s.income*100:null;return `<div class="row spread"><div><b>${esc(isCloud()?workspace?.name||'雲端帳本':'個人帳本')}</b><div class="muted">財務總覽</div></div>${monthPicker()}</div><div class="hero section"><small>NET WORTH · 淨資產</small><div class="amount">${money(total.net)}</div><div class="row spread"><small>資產 ${money(total.assets)}</small><small>負債 ${money(total.debt)}</small></div>${lineChart(months.map(m=>totals(m===today().slice(0,7)?today():endOf(m)).net),months.map(m=>m.slice(5)+'月'),true)}</div><div class="grid2"><div class="card tint"><small>↙ 本月收入</small><div class="amount">${money(s.income)}</div></div><div class="card pink"><small>↗ 本月淨支出</small><div class="amount">${money(s.expense)}</div></div><div class="card wide"><div class="row spread"><div><small>本月結餘</small><div class="amount">${money(s.income-s.expense)}</div></div><div><small>儲蓄率</small><h2>${rate===null?'—':rate.toFixed(1)+'%'}</h2></div></div><div class="bar"><span style="width:${Math.max(0,Math.min(100,rate??0))}%;background:#a8bba5"></span></div><small>投資轉入 ${money(s.invest)}（不計生活支出）</small></div></div><h2 class="section">快速記帳</h2>${quickHTML()}<div class="row spread section"><h2>近期交易</h2>${button('全部 ›','records','ghost')}</div><div class="card">${sorted(currentMonthTx()).slice(0,6).map(entry).join('')||'<div class="empty">這個月份沒有交易</div>'}</div>`}

function form(){if(!canEdit())return '<div class="card">此帳本目前不可編輯。</div>';if(!getAccounts().length)return `<div class="card stack"><h2>先建立一個財務帳戶</h2><p class="muted">例如現金、銀行存款或信用卡。交易會自動影響帳戶餘額。</p>${button('建立帳戶','assets','primary')}</div>`;if(!draft)newDraft();const d=draft,cats=listCats(d.type), r=recent().filter(t=>t.type===d.type).slice(0,3);return `<div class="row spread"><h2>${d.id?'編輯交易':'新增交易'}</h2>${button('取消','cancel','ghost')}</div><div class="seg section">${Object.entries(typeNames).map(([k,v])=>button(k==='adjust'?'調整':v,'kind',d.type===k?'active':'',`data-id="${k}" ${d.id?'disabled':''}`)).join('')}</div><div class="card section" style="text-align:center"><small>${esc(typeNames[d.type])} · TWD</small><div class="amount" style="font-size:42px" id="amountPreview">${esc(d.amountText)}</div><small>${d.type==='adjust'?'正數增加淨值，負數減少淨值':'請輸入金額'}</small></div><div class="cats">${cats.map(c=>`<button class="cat ${c===d.category?'active':''}" data-act="category" data-id="${esc(c)}"><span>${categoryIcons[c]||'·'}</span>${esc(c)}</button>`).join('')}${button('＋分類','newcat','cat')}</div>${r.length?`<h3 class="section">近期同類交易</h3><div class="grid3">${r.map(t=>`<button class="quick" data-act="quick" data-id="${esc(t.id)}"><small>${esc(t.note||t.category)}</small><b>${money(t.amount)}</b></button>`).join('')}</div>`:''}<div class="card section"><label for="note">備註</label><input id="note" value="${esc(d.note)}" placeholder="例如：早餐－便利商店" maxlength="120"><label for="account">${d.type==='transfer'?'轉出帳戶':'交易帳戶'}</label><select id="account">${accountOpts(d.account)}</select>${d.type==='transfer'?`<label for="to">轉入帳戶</label><select id="to">${accountOpts(d.to)}</select>`:''}<label for="date">日期</label><input id="date" type="date" value="${esc(d.date)}" max="${today()}"></div><div class="keypad section">${['1','2','3','4','5','6','7','8','9',d.type==='adjust'?'±':'00','0','⌫'].map(k=>button(k,'key','',`data-id="${k}"`)).join('')}</div><div class="inline section">${button('清除金 function analysis(){const all=currentMonthTx(),s=stats(all),months=monthList(),ss=months.map(m=>stats(getTx().filter(t=>t.date.startsWith(m)))),max=Math.max(1,...ss.flatMap(x=>[x.income,Math.abs(x.expense)])), cats=Object.create(null);for(const t of all)if(['expense','refund'].includes(t.type))cats[t.category]=(cats[t.category]||0)+(t.type==='expense'?t.amount:-t.amount);const groups=Object.entries(cats).sort((a,b)=>b[1]-a[1]), colors=['#dca38f','#a8bba5','#97adbf','#b8afce','#e6d09b'], pos=groups.filter(x=>x[1]>0), sum=pos.reduce((a,b)=>a+b[1],0);let offset=0;return `<div class="row spread"><h2>財務分析</h2>${monthPicker()}</div><div class="card section"><h3>六個月收支趨勢</h3><small>收入（綠）・淨支出（珊瑚）</small><svg class="chart" viewBox="0 0 320 166" aria-label="月收入支出圖">${[24,60,96,132].map(y=>`<line x1="5" y1="${y}" x2="315" y2="${y}" stroke="#e6e5dc" stroke-dasharray="3 4"/>`).join('')}${ss.map((v,i)=>`<rect x="${12+i*52}" y="${132-v.income/max*110}" width="17" height="${v.income/max*110}" rx="4" fill="#a8bba5"/><rect x="${31+i*52}" y="${132-Math.abs(v.expense)/max*110}" width="17" height="${Math.abs(v.expense)/max*110}" rx="4" fill="#dca38f"/><text x="${29+i*52}" y="151" fill="#65746b" font-size="10" text-anchor="middle">${months[i].slice(5)}月</text>`).join('')}</svg>${ss.some(x=>x.expense<0)?'<small>退款超過支出的月份以絕對值顯示；明細保留負值。</small>':''}</div><div class="card section"><h3>支出分類</h3><div class="row"><svg viewBox="0 0 140 140" width="44%" aria-label="支出分類圖"><circle cx="70" cy="70" r="51" stroke="#e6e5dc" stroke-width="18" fill="none"/>${pos.map(([c,v],i)=>{const p=v/sum*100,o=offset;offset+=p;return `<circle cx="70" cy="70" r="51" stroke="${colors[i%colors.length]}" stroke-width="18" fill="none" pathLength="100" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${-o}" transform="rotate(-90 70 70)"/>`}).join('')}<text x="70" y="66" text-anchor="middle" fill="#65746b" font-size="10">淨支出</text><text x="70" y="84" text-anchor="middle" fill="#263f36" font-size="15" font-weight="bold">${esc(money(s.expense))}</text></svg><div style="flex:1">${groups.slice(0,8).map(([c,v],i)=>`<div class="row spread" style="margin:6px 0"><span class="tiny">${esc(c)}</span><b class="tiny">${money(v)}</b></div>`).join('')||'<small>尚無支出</small>'}</div></div><small>圓環只呈現正淨支出的分類。</small></div><div class="card section"><h3>淨資產歷史</h3>${lineChart(months.map(m=>totals(m===today().slice(0,7)?today():endOf(m)).net),months.map(m=>m.slice(5)+'月'))}<small>依起始餘額、交易與手動估值重建，非券商即時行情。</small></div><div class="card tint section"><h3>本月財務洞察</h3><p>收入 ${money(s.income)}，淨支出 ${money(s.expense)}，收支結餘 ${money(s.income-s.expense)}。${groups[0]&&groups[0][1]>0?'最大支出分類為 '+esc(groups[0][0])+'。':''}轉入投資帳戶 ${money(s.invest)}。</p></div>`}
function records(){const rows=sorted(currentMonthTx().filter(t=>(typeFilter==='all'||t.type===typeFilter)&&(memberFilter==='all'||t.createdBy===memberFilter)&&[t.note,t.category,accountName(t.account),t.amount].some(v=>String(v).toLowerCase().includes(filter.toLowerCase()))));const members=[...new Set(getTx().map(t=>t.createdBy).filter(Boolean))];return `<div class="row spread"><h2>交易明細 · Raw Data</h2>${monthPicker()}</div><div class="stack section"><input id="search" placeholder="搜尋備註、分類、帳戶、金額" value="${esc(filter)}"><div class="grid2"><select id="typeFilter">${opt([['all','全部類型'],...Object.entries(typeNames)],typeFilter)}</select><select id="memberFilter">${opt([['all','全部建立者'],...members.map(m=>[m,m===user?.uid?'我':m==='local'?'本機':m.slice(0,10)+'…'])],memberFilter)}</select></div></div><div class="row spread section"><small>${rows.length} 筆交易</small>${button('匯出本月 CSV','csv','ghost')}</div><div class="card scroll"><table><thead><tr><th>日期</th><th>類型／分類</th><th>備註</th><th>金額</th><th>帳戶</th><th>轉入</th><th>建立者</th><th></th></tr></thead><tbody>${rows.map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(typeNames[t.type])} / ${esc(t.category)}</td><td>${esc(t.note)}</td><td>${money(t.amount)}</td><td>${esc(accountName(t.account))}</td><td>${t.to?esc(accountName(t.to)):'—'}</td><td>${esc(t.createdBy===user?.uid?'我':t.createdBy||'本機')}</td><td>${canEdit()?button('編輯','edit','ghost',`data-id="${esc(t.id)}"`):''}</td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">沒有符合條件的交易</div>'}</div><div class="card section">${rows.map(entry).join('')||'<div class="empty">沒有符合條件的交易</div>'}</div>`}
function settings(){return `<h2>設定與帳本</h2><div class="card section stack"><h3>${isCloud()?'雲端模式':'本機模式'}</h3><p class="subtitle">${isCloud()?'使用 Google 登入、Firestore 權限及即時讀取。':'本機資料僅存在目前瀏覽器，不會同步。請定期匯出。'}</p>${isCloud()?`${user?`<p>${esc(user.email||'Google 使用者')}</p><small class="member">我的 UID：${esc(user.uid)}</small>${button('複製我的 UID','copyuid')}${button('登出','logout','ghost')}`:button('Google 登入','login','primary',sdk?'':'disabled')}${user?`<div class="line"></div><h3>帳本</h3>${workspace?`<p>${esc(workspace.name)} · ${esc(role())}</p><small class="member">帳本 ID：${esc(wid)}</small>${button('複製帳本 ID','copywid')}${role()==='owner'?`<label>邀請成員：輸入對方 UID</label><input id="memberUid" placeholder="對方登入後提供的 UID"><select id="memberRole">${opt([['editor','編輯者'],['viewer','瀏覽者']],'editor')}</select>${button('授權成員','addmember','primary')}<div>${Object.entries(workspace.members||{}).map(([id,r])=>`<div class="entry"><div class="info"><small class="member">${esc(id)}</small><p>${esc(r)}</p></div>${button('移除','removemember','danger',`data-id="${esc(id)}"`)}</div>`).join('')}</div>`:''}`:'<p class="muted">尚未選擇可存取的帳本。</p>'}<label>開啟其他帳本</label><input id="joinId" placeholder="貼上帳本 ID" value="${esc(wid)}">${button('開啟帳本','join','primary')}<label>建立自己的新帳本</label><input id="wsname" placeholder="例如：個人財務" maxlength="60">${button('建立帳本','createws')}`:''}${configError?`<div class="msg">${esc(configError)}</div>`:''}`:''}${button(isCloud()?'切換本機模式':'連接 Firebase 雲端','switchmode')}</div><div class="card section stack"><h3>Firebase 連線設定</h3><p class="subtitle">貼上 Firebase Console 提供的 Web app firebaseConfig（只需要公開的 Web 設定，不要貼服務帳戶私鑰）。</p><textarea id="config" placeholder='{"apiKey":"…","authDomain":"…","projectId":"…","appId":"…"}'>${esc(config?JSON.stringify(config,null,2):'')}</textarea>${button('儲存雲端設定','saveconfig','primary')}<small>這份設定保留在此瀏覽器。其他手機需使用同一份設定。</small></div><div class="card section stack"><h3>匯出與備份</h3>${button('完整 JSON 備份','backup','',isCloud()&&!loaded?'disabled':'')}${button('所有交易 CSV','allcsv','',isCloud()&&!loaded?'disabled':'')}${!isCloud()?`<label>還原本機 JSON（取代現有本機資料）</label><input type="file" id="restore" accept=".json,application/json">${button('還原資料','restore','danger')}`:''}<small>下載後在 iPhone「檔案」移至 iCloud Drive。雲端帳本不會自動寫入 iCloud。</small></div><div class="card section stack"><h3>試用與版本</h3>${!isCloud()?button('載入範例資料','demo') : ''}<p class="subtitle">v1.0 · TWD 單幣別。雲端讀寫需網路；資產估值手動更新。此版本未包含自動匯率、券商串接、預算、歷史稽核與最愛釘選。</p></div>`}
let shortcutPending=null;
function captureShortcut(){
  const h=location.hash;
  if(h!=='#add'&&!h.startsWith('#add?'))return false;
  if(draft&&!confirm('開啟捷徑將取代目前未儲存的交易，確定嗎？')){history.replaceState(null,'',location.pathname+location.search);return false}
  const params=new URLSearchParams(h.slice(5));
  const type=params.get('type')||'expense';
  shortcutPending={type:['expense','income','transfer','refund'].includes(type)?type:'expense',amount:params.get('amount')||'',category:params.get('category')||'',note:params.get('note')||'',account:params.get('account')||''};
  draft=null;page='add';return true;
}
function applyShortcut(){
  if(!shortcutPending||!canEdit()||!getAccounts().length)return;
  const p=shortcutPending;shortcutPending=null;
  history.replaceState(null,'',location.pathname+location.search);
  newDraft();draft.type=p.type;draft.category=listCats(p.type).includes(p.category)?p.category:listCats(p.type)[0];
  const amount=Number(p.amount);draft.amountText=p.amount&&int(amount)&&amount>0&&/^\d+$/.test(p.amount)?String(amount):'0';
  draft.note=p.note.slice(0,120);
  const matches=getAccounts().filter(a=>a.name===p.account||a.id===p.account);draft.account=matches.length===1?matches[0].id:'';
  draft.to='';draft.fresh=true;page='add';
  toast('捷徑資料已帶入，請確認帳戶、分類及金額後儲存');
}
window.addEventListener('hashchange',()=>{if(captureShortcut())render()});
function render(){applyShortcut();const labels={home:'總覽',assets:'資產',add:'記帳',analysis:'分析',records:'明細'};$('status').textContent=isCloud()?(loaded?'雲端 · '+role():'雲端設定'):'本機 · 試用';$('nav').innerHTML=Object.entries(labels).map(([k,v])=>`<button data-act="${k}" class="${page===k?'active':''} ${k==='add'?'plus':''}"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[k]}</svg>${v}</button>`).join('');$('notice').innerHTML=isCloud()&&!loaded?'<div class="msg" style="margin-bottom:12px">雲端帳本尚未就緒。請前往設定登入或選擇帳本。</div>':'';if(isCloud()&&!loaded&&page!=='settings'){ $('screen').innerHTML=`<div class="card stack"><h2>連接雲端帳本</h2>${button('前往設定','settings','primary')}</div>`;return}const fn={home,assets,add:form,analysis,records,settings,newaccount:accountForm}[page]||home;$('screen').innerHTML=fn()}
function saveLocal(){put('mf-local-v1',local)}function syncDraft(){if(!draft)return;for(const k of ['note','account','to','date'])if($(k))draft[k]=$(k).value}
async function withBusy(fn){if(busy)return;busy=true;try{await fn()}catch(e){error(e)}finally{busy=false;render()}}
function cleanRecord(t){const actor=isCloud()?user.uid:'local', old=t.id?getTx().find(x=>x.id===t.id):null;return {id:t.id||uid(),type:t.type,category:t.category,note:t.note.trim(),amount:Number(t.amountText),account:t.account,to:t.type==='transfer'?t.to:'',date:t.date,createdBy:old?.createdBy||actor,createdAt:old?.createdAt||Date.now(),updatedBy:actor,updatedAt:Date.now(),rev:(old?.rev||0)+1}}
function validateTx(t){const a=getAccounts().find(a=>a.id===t.account),b=getAccounts().find(a=>a.id===t.to);if(!int(t.amount)||t.amount===0||(t.type!=='adjust'&&t.amount<0))throw Error('請輸入有效整數金額');if(!a||!dateOk(t.date)||t.date>today()||t.date<a.openDate)throw Error('請確認帳戶及交易日期（不得早於帳戶起始日期）');if(t.type==='transfer'&&(!b||b.id===a.id||t.date<b.openDate))throw Error('請選擇不同的有效轉入帳戶及日期');if(!t.category||t.category.length>40||t.note.length>120)throw Error('分類或備註不合法')}
async function saveTx(){syncDraft();if(!canEdit())throw Error('沒有編輯權限');const oldId=draft.id,t=cleanRecord(draft);validateTx(t);if(isCloud()){const ref=sdk.doc(db,'workspaces',wid,'transactions',t.id);await sdk.runTransaction(db,async tr=>{const snap=await tr.get(ref);if(oldId&&(!snap.exists()||snap.data().rev!==draft.rev))throw Error('交易已被其他成員修改，請重新開啟');if(!oldId&&snap.exists())throw Error('重複 ID');tr.set(ref,t)})}else{if(oldId)local.transactions=local.transactions.map(x=>x.id===t.id?t:x);else local.transactions.push(t);saveLocal()}draft=null;page='home';month=t.date.slice(0,7);toast('交易已儲存')}
async function deleteTx(){if(!canEdit()||!draft?.id)return;if(!confirm('確定刪除此交易？'))return;const id=draft.id;if(isCloud()){const ref=sdk.doc(db,'workspaces',wid,'transactions',id);await sdk.runTransaction(db,async tr=>{const snap=await tr.get(ref);if(!snap.exists()||snap.data().rev!==draft.rev)throw Error('交易已被其他成員修改，請重新開啟');tr.delete(ref)})}else{local.transactions=local.transactions.filter(t=>t.id!==id);saveLocal()}draft=null;page='records';toast('交易已刪除')}
async function saveAccount(){if(!canEdit())throw Error('沒有編輯權限');const name=$('aname').value.trim(),type=$('atype').value,n=Number($('aopening').value),openDate=$('adate').value;if(!name||name.length>60||!accountTypes[type]||!int(n)||n<0||!dateOk(openDate)||openDate>today())throw Error('請確認帳戶資料');const a={id:uid(),name,type,opening:['credit','loan'].includes(type)?-n:n,openDate,createdBy:isCloud()?user.uid:'local',createdAt:Date.now()};if(isCloud())await sdk.setDoc(sdk.doc(db,'workspaces',wid,'accounts',a.id),a);else{local.accounts.push(a);saveLocal()}page='assets';toast('帳戶已建立')}
async function addCategory(){if(!canEdit())return;syncDraft();const c=prompt('新增分類名稱')?.trim();if(!c)return;if(c.length>40)throw Error('分類名稱太長');if(listCats(draft.type).includes(c)){draft.category=c;render();return}if(isCloud()){if(role()!=='owner')throw Error('只有帳本擁有者可新增自訂分類');await sdk.updateDoc(sdk.doc(db,'workspaces',wid),{['categories.'+draft.type]:sdk.arrayUnion(c)})}else{local.categories[draft.type]=[...(local.categories[draft.type]||[]),c];saveLocal()}draft.category=c;render()}
function parseConfig(s){try{const x=JSON.parse(s);if(x&&typeof x==='object')return x}catch{}const keys=['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId'];const c={};for(const k of keys){const match=s.match(new RegExp('(?:["\']?'+k+'["\']?)\\s*:\\s*["\']([^"\']+)["\']'));if(match)c[k]=match[1]}return c}
function validConfig(c){return c&&['apiKey','authDomain','projectId','appId'].every(k=>typeof c[k]==='string'&&c[k].length>0)}
function stopCloud(){cloudEpoch++;for(const f of stops)f();stops=[];workspace=null;accounts=[];tx=[];loaded=false;draft=null}
async function connect(){if(!isCloud()||!validConfig(config))return;try{const base='https://www.gstatic.com/firebasejs/10.14.1/';const [a,b,c]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);sdk={...a,...b,...c};const app=a.getApps().length?a.getApp():a.initializeApp(config);auth=b.getAuth(app);db=c.getFirestore(app);if(authStop)authStop();authStop=b.onAuthStateChanged(auth,u=>{user=u;stopCloud();if(user&&wid)listenWorkspace();render()},e=>{configError=e.message;render()});configError='';render()}catch(e){configError='無法連接 Firebase：'+e.message;render()}}
function listenWorkspace(){stopCloud();if(!user||!wid||!sdk)return;const epoch=cloudEpoch;const ref=sdk.doc(db,'workspaces',wid);let started=false, gotA=false,gotT=false;const fail=e=>{if(epoch!==cloudEpoch)return;stopCloud();configError='無法讀取帳本：'+e.message;page='settings';render()};const finish=()=>{if(epoch!==cloudEpoch)return;loaded=gotA&&gotT;if(loaded&&!draft)render();else if(page==='settings')render()};stops.push(sdk.onSnapshot(ref,{includeMetadataChanges:true},snap=>{if(epoch!==cloudEpoch)return;if(snap.metadata.fromCache&&!started)return;if(!snap.exists()){fail(Error('帳本不存在或沒有權限'));return}workspace=snap.data();if(role()==='none'){fail(Error('你未獲授權'));return}configError='';if(!started){started=true;stops.push(sdk.onSnapshot(sdk.collection(ref,'accounts'),s=>{if(epoch!==cloudEpoch)return;accounts=s.docs.map(d=>d.data());gotA=true;finish()},fail));stops.push(sdk.onSnapshot(sdk.collection(ref,'transactions'),s=>{if(epoch!==cloudEpoch)return;tx=s.docs.map(d=>d.data());gotT=true;finish()},fail))}else if(page==='settings')render()},fail))}
async function createWorkspace(){const name=$('wsname').value.trim();if(!user||!name||name.length>60)throw Error('請先登入並輸入帳本名稱');const id=uid();await sdk.setDoc(sdk.doc(db,'workspaces',id),{name,owner:user.uid,members:{},categories:{},createdAt:Date.now()});wid=id;put('mf-workspace',wid);listenWorkspace();toast('帳本已建立')}
async function memberAdd(){const id=$('memberUid').value.trim(),r=$('memberRole').value;if(role()!=='owner'||!id||!/^[-_A-Za-z0-9]{1,128}$/.test(id)||id===user.uid)throw Error('請確認成員 UID');await sdk.updateDoc(sdk.doc(db,'workspaces',wid),{['members.'+id]:r});toast('成員已授權，請將帳本 ID 傳給對方')}

async function copyText(s){try{await navigator.clipboard.writeText(s);toast('已複製')}catch{prompt('請手動複製',s)}}
function csvEscape(v){let s=String(v??'');if(/^[\s]*[=+@-]/.test(s)&&typeof v!=='number')s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}function exportCSV(rows){const keys=['id','date','type','category','note','amount','account','to','createdBy','updatedBy','createdAt','updatedAt','rev'];return '\ufeff'+[keys.join(','),...sorted(rows).map(t=>keys.map(k=>csvEscape(k==='account'||k==='to'?t[k]?accountName(t[k]):'':t[k])).join(','))].join('\r\n')}
async function download(name,contents,type){const file=new File([contents],name,{type});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}}const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function backup(){return download('MyFinance-'+today()+'.json',JSON.stringify({version:1,exportedAt:new Date().toISOString(),accounts:getAccounts(),transactions:getTx(),categories:isCloud()?workspace.categories||{}:local.categories},null,2),'application/json')}
function validBackup(x){if(x.version!==1||!Array.isArray(x.accounts)||!Array.isArray(x.transactions)||!x.categories||typeof x.categories!=='object')return false;const ids=new Set();for(const a of x.accounts){if(!a||typeof a.id!=='string'||!/^[-_A-Za-z0-9]{1,128}$/.test(a.id)||ids.has(a.id)||typeof a.name!=='string'||!accountTypes[a.type]||!int(a.opening)||!dateOk(a.openDate))return false;ids.add(a.id)}const ts=new Set();for(const t of x.transactions){if(!t||typeof t.id!=='string'||!/^[-_A-Za-z0-9]{1,128}$/.test(t.id)||ts.has(t.id)||!typeNames[t.type]||!ids.has(t.account)||!int(t.amount)||!t.amount||(t.type!=='adjust'&&t.amount<0)||!dateOk(t.date)||typeof t.note!=='string'||typeof t.category!=='string'||(t.type==='transfer'&&(!ids.has(t.to)||t.to===t.account)))return false;ts.add(t.id)}return Object.values(x.categories).every(v=>Array.isArray(v)&&v.every(c=>typeof c==='string'&&c.length<=40))}
async function restore(){const f=$('restore')?.files[0];if(!f)throw Error('請選擇備份檔');const x=JSON.parse(await f.text());if(!validBackup(x))throw Error('備份格式不正確');if(!confirm('本機現有資料將被取代，確定？'))return;local={accounts:x.accounts,transactions:x.transactions,categories:x.categories};saveLocal();toast('已還原本機資料')}
function demo(){if(local.accounts.length||local.transactions.length){if(!confirm('範例資料會取代目前本機資料。確定？'))return}const m=today().slice(0,7), date=n=>m+'-'+String(Math.min(n,Number(today().slice(-2)))).padStart(2,'0');local={categories:{},accounts:[{id:'bank',name:'銀行存款',type:'bank',opening:100000,openDate:date(1)},{id:'cash',name:'現金',type:'cash',opening:3000,openDate:date(1)},{id:'card',name:'信用卡',type:'credit',opening:0,openDate:date(1)},{id:'etf',name:'ETF 投資',type:'investment',opening:60000,openDate:date(1)}],transactions:[]};const rows=[['income','薪資','月薪',78000,'bank','',5],['expense','早餐','早餐－711',22,'cash','',8],['expense','午餐','午餐－自助餐',30,'cash','',10],['expense','居住','房租',11000,'bank','',12],['expense','交通','加油',1000,'card','',14],['transfer','投資','0050 定期定額',4263,'bank','etf',16],['expense','飲料','兩瓶豆漿',50,'card','',18],['transfer','還款','信用卡繳款',1000,'bank','card',19]];for(const [type,category,note,amount,account,to,day] of rows)local.transactions.push({id:uid(),type,category,note,amount,account,to,date:date(day),createdBy:'local',updatedBy:'local',createdAt:Date.now(),updatedAt:Date.now(),rev:1});saveLocal();page='home';month=m;toast('已載入假設範例資料')}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled||busy)return;const a=el.dataset.act,id=el.dataset.id;try{if(['home','analysis','records','cancel'].includes(a)&&shortcutPending){shortcutPending=null;history.replaceState(null,'',location.pathname+location.search)}if(['home','assets','analysis','records','settings','newaccount'].includes(a)){if(page==='add')draft=null;setPage(a);return}if(a==='add'){draft=null;setPage('add');return}if(a==='cancel'){draft=null;setPage('home');return}if(a==='edit'||a==='quick'){const t=getTx().find(t=>t.id===id);if(t&&canEdit()){newDraft(t,a==='quick');setPage('add')}return}if(a==='adjust'){newDraft();draft.type='adjust';draft.category='估值';draft.account=id;setPage('add');return}if(a==='kind'){syncDraft();draft.type=id;draft.category=listCats(id)[0];draft.to='';draft.amountText='0';draft.fresh=true;render();return}if(a==='category'){syncDraft();draft.category=id;render();return}if(a==='key'||a==='clear'){syncDraft();let s=draft.amountText;if(a==='clear'){s='0';draft.fresh=true}else if(id==='±'){s=s.startsWith('-')?s.slice(1):'-'+s;draft.fresh=false}else if(id==='⌫'){s=s.slice(0,-1)||'0';if(s==='-')s='0';draft.fresh=false}else{let sign=s.startsWith('-')?'-':'';s=(draft.fresh?'':s.replace('-',''))+id;s=sign+(s.replace(/^0+(?=\d)/,'').slice(0,12)||'0');draft.fresh=false}draft.amountText=s;$('amountPreview').textContent=s;return}if(a==='newcat')return await addCategory();if(a==='save')return await withBusy(saveTx);if(a==='delete')return await withBusy(deleteTx);if(a==='saveaccount')return await withBusy(saveAccount);if(a==='demo'){demo();render();return}if(a==='backup')return await backup();if(a==='csv'||a==='allcsv')return await download('MyFinance-'+(a==='csv'?month:'all')+'.csv',exportCSV(a==='csv'?currentMonthTx():getTx()),'text/csv');if(a==='restore')return await withBusy(restore);if(a==='saveconfig'){const c=parseConfig($('config').value);if(!validConfig(c))throw Error('firebaseConfig 缺少必要欄位');put('mf-config',c);put('mf-mode','cloud');if(config?.projectId!==c.projectId)put('mf-workspace','');location.reload();return}if(a==='switchmode'){put('mf-mode',isCloud()?'local':'cloud');location.reload();return}if(a==='login'){await sdk.signInWithPopup(auth,new sdk.GoogleAuthProvider());return}if(a==='logout'){await sdk.signOut(auth);put('mf-workspace','');wid='';return}if(a==='join'){wid=$('joinId').value.trim();if(!/^[A-Za-z0-9_-]{1,128}$/.test(wid))throw Error('帳本 ID 格式錯誤');put('mf-workspace',wid);listenWorkspace();render();return}if(a==='createws')return await withBusy(createWorkspace);if(a==='copyuid')return await copyText(user.uid);if(a==='copywid')return await copyText(wid);if(a==='addmember')return await withBusy(memberAdd);if(a==='removemember')return await withBusy(()=>memberRemove(id))}catch(err){error(err)}});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='month'){month=e.target.value||today().slice(0,7);render()}else if(id==='typeFilter'){typeFilter=e.target.value;render()}else if(id==='memberFilter'){memberFilter=e.target.value;render()}else if(id==='search'){filter=e.target.value;render()}});document.addEventListener('keydown',e=>{if(e.target.id==='search'&&e.key==='Enter'){filter=e.target.value;render()}});
captureShortcut();render();if(isCloud())connect();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
